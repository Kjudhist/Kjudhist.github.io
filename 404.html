<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <!-- GitHub Pages serves this file at whatever address was missed (say /foo/bar),
       so relative URLs are pinned to the site root. -->
  <base href="/">
  <script>
    // Opened from disk there is no site root, so fall back to this file's own folder.
    if (location.protocol === 'file:') document.querySelector('base').href = location.href.replace(/[^/]*$/, '');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.404.title">Page not found · Kevin JG</title>
  <meta name="description" content="This page doesn’t exist. Head back to the gate." data-i18n-attr="content:meta.404.desc">
  <meta name="author" content="Kevin Judhistira Girsang">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1626">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kevin JG">
  <meta property="og:title" content="Page not found · Kevin JG">
  <meta property="og:description" content="This page doesn’t exist. Head back to the gate.">
  <meta property="og:image" content="https://kjudhist.github.io/assets/og/og-gate.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kjudhist.github.io/assets/og/og-gate.jpg">

  <link rel="icon" href="assets/icons/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gate.css">

  <script src="js/i18n.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body class="gate">
  <header class="topbar topbar--gate">
    <div class="topbar__end">
      <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:common.lang" data-testid="lang-switcher">
        <button class="lang__opt" type="button" lang="en" title="English" aria-label="English" aria-pressed="true" data-lang-option="en" data-testid="lang-option-en">EN</button>
        <button class="lang__opt" type="button" lang="id" title="Bahasa Indonesia" aria-label="Bahasa Indonesia" aria-pressed="false" data-lang-option="id" data-testid="lang-option-id">ID</button>
        <button class="lang__opt" type="button" lang="ja" title="日本語" aria-label="日本語" aria-pressed="false" data-lang-option="ja" data-testid="lang-option-ja">日本語</button>
      </div>
    </div>
  </header>

  <main class="lost" id="main" data-testid="section-not-found">
    <div class="lost__inner">
      <svg class="lost__enso" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <defs>
          <filter id="enso-edge" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="3" seed="6"/>
            <feDisplacementMap in="SourceGraphic" scale="4"/>
          </filter>
        </defs>
        <g fill="none" stroke="currentColor" stroke-linecap="round" filter="url(#enso-edge)">
          <path d="M146.3 44.8A72 72 0 1 1 37.6 136" stroke-width="14"/>
          <path d="M37.6 136A72 72 0 0 1 93.7 28.3" stroke-width="10"/>
          <path d="M93.7 28.3A72 72 0 0 1 124.6 32.3" stroke-width="4.5" opacity=".75"/>
        </g>
      </svg>
      <p class="lost__code">404</p>
      <h1 class="lost__title" data-i18n="nf.title">Nothing behind this door.</h1>
      <p class="lost__text" data-i18n="nf.text">The page you’re looking for isn’t here. The link may be old or mistyped.</p>
      <a class="btn lost__back" href="./" data-transition="dark" data-testid="back-to-gate">
        <svg class="back-link__arrow" viewBox="0 0 28 10" aria-hidden="true" focusable="false"><path d="M27 5H1M5 1 1 5l4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <span data-i18n="common.back">Back to the gate</span>
      </a>
    </div>
  </main>

  <footer class="credit" data-testid="site-footer">
    <p><span>© 2026 Kevin JG</span><span class="credit__dot" aria-hidden="true">·</span><span data-i18n="common.made">Made with help from Claude</span></p>
  </footer>
</body>
</html>
