<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Share image: gate</title>
  <!-- Source for assets/og/og-gate.jpg. Serve the site locally and screenshot this page at 1200x630. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/gate.css">
  <style>
    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body.gate {
      --door-h: 410px;
      --door-gap: 52px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: none;
      align-items: center;
      min-height: 0;
      padding: 0 110px 0 104px;
      animation: none;
    }

    .door {
      animation: none;
    }

    .door__caption {
      display: none;
    }

    .og-name {
      margin: 22px 0 26px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 70px;
      line-height: 1.02;
      letter-spacing: 0.02em;
      color: var(--washi-50);
    }

    .og-name span {
      display: block;
      padding-left: 56px;
    }

    .og-roles {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 26px;
      color: var(--indigo-100);
    }

    .og-url {
      margin-top: 40px;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }

    .og-rule {
      display: block;
      width: 56px;
      height: 1px;
      margin-top: 30px;
      background: var(--gold-300);
    }
  </style>
</head>
<body class="gate">
  <div>
    <p class="eyebrow">Bekasi, Indonesia</p>
    <h1 class="og-name">Kevin Judhistira <span>Girsang</span></h1>
    <p class="og-roles">QA Engineer · The Willow Atelier</p>
    <span class="og-rule"></span>
    <p class="og-url">KJUDHIST.GITHUB.IO</p>
  </div>

  <div class="gate__stage">
    <span class="door door--swing is-peek">
      <span class="door__unit">
        <span class="door__spill"></span>
        <span class="door__frame">
          <span class="door__opening">
            <span class="door__world"></span>
            <span class="door__leaf">
              <span class="door__panel door__panel--upper"></span>
              <span class="door__panel door__panel--lower"></span>
              <span class="door__pull"></span>
            </span>
          </span>
        </span>
      </span>
    </span>
    <span class="door door--slide">
      <span class="door__unit">
        <span class="door__spill"></span>
        <span class="door__frame">
          <span class="door__opening">
            <span class="door__world"></span>
            <span class="shoji shoji--left"></span>
            <span class="shoji shoji--right"></span>
          </span>
        </span>
      </span>
    </span>
  </div>
</body>
</html>
