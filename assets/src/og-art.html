<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Share image: The Willow Atelier</title>
  <!-- Source for assets/og/og-art.jpg. Serve the site locally and screenshot this page at 1200x630.
       The garden is borrowed from the art page itself so the two never drift apart. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP:wght@300;400&family=Shippori+Mincho:wght@400;500&display=swap">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/art.css">
  <style>
    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      animation: none;
    }

    .art-hero {
      min-height: 630px;
      height: 630px;
      padding: 0 0 190px;
    }

    .art-hero__text {
      width: auto;
      margin: 0 0 0 104px;
    }

    .art-hero__text > *,
    .art-hero__mark,
    .art-hero__stars,
    .art-hero__cloud,
    .art-hero__mist,
    .art-hero__reflection i,
    .willow__sway {
      animation: none;
    }

    .art-hero__scroll {
      display: none;
    }

    .art-hero__title {
      font-size: 92px;
    }

    .art-hero__tagline {
      font-size: 28px;
    }

    .art-hero__moon {
      width: 74px;
    }

    .art-hero__cloud--1 {
      transform: translate3d(330px, 0, 0);
    }

    .art-hero__cloud--2 {
      transform: translate3d(620px, 0, 0);
    }

    .art-hero__cloud--3 {
      display: none;
    }
  </style>
</head>
<body class="art">
  <div id="hero"></div>
  <script src="../../js/art.js"></script>
  <script>
    fetch('../../art/index.html')
      .then(function (res) { return res.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var hero = doc.querySelector('.art-hero');
        hero.querySelectorAll('canvas, [data-split-target]').forEach(function (el) { el.remove(); });
        document.getElementById('hero').replaceWith(hero);
        if (window.atelier) window.atelier.leafWillow(hero.querySelector('[data-willow]'));
        document.title += ' (ready)';
      });
  </script>
</body>
</html>
