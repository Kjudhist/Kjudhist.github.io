<body class="gate">
  <header class="gate__top">
    <!-- the name sticker (お名前シール) every Japanese school thing carries -->
    <div class="nametag" data-testid="station-sign">
      <span class="nametag__label" aria-hidden="true" data-i18n="gate.name">Name</span>
      <h1 class="nametag__name" translate="no"><span class="sr-only">Kevin Judhistira Girsang</span><span class="hand" aria-hidden="true" data-reveal="write">Kevin JG</span></h1>
    </div>
    <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:common.lang" data-testid="lang-switcher">
      <button class="lang__opt" type="button" lang="en" title="English" aria-label="English" aria-pressed="true" data-lang-option="en" data-testid="lang-option-en">EN</button>
      <button class="lang__opt" type="button" lang="id" title="Bahasa Indonesia" aria-label="Bahasa Indonesia" aria-pressed="false" data-lang-option="id" data-testid="lang-option-id">ID</button>
      <button class="lang__opt" type="button" lang="ja" title="日本語" aria-label="日本語" aria-pressed="false" data-lang-option="ja" data-testid="lang-option-ja">日本語</button>
    </div>
  </header>

  <main class="gate__main" id="main">
    <div class="gate__intro">
      <p class="gate__full" translate="no" aria-hidden="true">Kevin Judhistira Girsang</p>
      <p class="gate__hint hand" data-i18n="gate.intro">Open one.</p>
    </div>

    <!-- Two notebooks on a cutting mat. Each is a door: the cover lifts to peek, then opens. -->
    <nav class="desk" aria-label="Notebooks" data-i18n-attr="aria-label:gate.doors" data-gate data-testid="gate-doors">

      <a class="door door--qa" href="qa/" data-door data-tone="light" data-testid="door-qa">
        <span class="book book--note">
          <span class="book__page" aria-hidden="true">
            <span class="book__scribble hand" data-i18n="qa.hero.pitch">Product-focused QA Engineer</span>
          </span>
          <span class="book__cover">
            <span class="book__label">
              <span class="book__no" aria-hidden="true">No. <span class="hand">1</span></span>
              <span class="book__title hand" data-i18n="gate.qa">QA Engineer</span>
              <span class="book__kind" data-i18n="book.qa">Test notes</span>
            </span>
          </span>
        </span>
        <span class="door__cue hand" aria-hidden="true" data-cue data-i18n="gate.tap" data-testid="door-qa-cue">Tap to open</span>
      </a>

      <a class="door door--art" href="art/" data-door data-tone="dark" data-testid="door-art">
        <span class="book book--sketch">
          <span class="book__page" aria-hidden="true">
            <span class="book__scribble hand" data-i18n="art.tagline">Where the lost come to rest.</span>
          </span>
          <span class="book__cover">
            <span class="book__kanji" lang="ja" aria-hidden="true">柳</span>
            <span class="book__label">
              <span class="book__title hand" translate="no" data-i18n="gate.art">The Willow Atelier</span>
              <span class="book__kind" data-i18n="book.art">Sketchbook</span>
            </span>
          </span>
          <span class="book__rings" aria-hidden="true"></span>
        </span>
        <span class="door__cue hand" aria-hidden="true" data-cue data-i18n="gate.tap" data-testid="door-art-cue">Tap to open</span>
      </a>

    </nav>
  </main>

  <footer class="ruler" data-testid="site-footer">
    <p class="credit"><span>© 2026 Kevin JG</span><span class="credit__dot" aria-hidden="true">·</span><span data-i18n="common.made">Made with help from Claude</span></p>
  </footer>
</body>
</html>
