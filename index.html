<body class="gate">
  <header class="g-top">
    <div class="g-id" data-testid="station-sign">
      <h1 class="g-name" translate="no">Kevin Judhistira Girsang</h1>
    </div>
    <div class="g-meta">
      <p class="g-clock"><span data-i18n="gate.local">Local time</span> <span class="mono" translate="no">Jakarta <time data-clock>--:--</time> WIB</span></p>
      <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:common.lang" data-testid="lang-switcher">
        <button class="lang__opt" type="button" lang="en" title="English" aria-label="English" aria-pressed="true" data-lang-option="en" data-testid="lang-option-en">EN</button>
        <button class="lang__opt" type="button" lang="id" title="Bahasa Indonesia" aria-label="Bahasa Indonesia" aria-pressed="false" data-lang-option="id" data-testid="lang-option-id">ID</button>

    </div>

  <main class="g-main" id="main">
    <p class="g-intro" data-i18n="gate.intro">Choose a door.</p>

    <!-- Two doors. Each whole panel is the link; the Enter label says so. -->
    <nav class="g-doors" aria-label="Doors" data-i18n-attr="aria-label:gate.doors" data-gate data-testid="gate-doors">
      <a class="door door--qa" href="qa/" data-door data-tone="light" data-testid="door-qa">
        <span class="door__head"><span class="door__no mono" aria-hidden="true">01</span><span class="door__jp" lang="ja" aria-hidden="true">品質保証</span></span>
        <span class="door__foot">
          <span class="door__title" data-i18n="gate.qa">QA Engineer</span>
          <span class="door__sub" data-i18n="qa.hero.sub">Payments · Online Banking · Jakarta</span>
          <span class="door__cta"><span data-i18n="gate.enter">Enter</span><svg class="arrow" viewBox="0 0 32 10" aria-hidden="true" focusable="false"><path d="M0 5h31M27 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
        </span>
      </a>
      <a class="door door--art" href="art/" data-door data-tone="dark" data-testid="door-art">
        <span class="door__head"><span class="door__no mono" aria-hidden="true">02</span><span class="door__jp" lang="ja" aria-hidden="true">柳のアトリエ</span></span>
        <span class="door__foot">
          <span class="door__title" translate="no" data-i18n="gate.art">The Willow Atelier</span>
          <span class="door__sub"><span data-i18n="art.painting.title">Drawing &amp; Painting</span><span aria-hidden="true"> · </span><span data-i18n="art.photo.title">Photography</span><span aria-hidden="true"> · </span><span data-i18n="art.music.title">Music</span></span>
          <span class="door__cta"><span data-i18n="gate.enter">Enter</span><svg class="arrow" viewBox="0 0 32 10" aria-hidden="true" focusable="false"><path d="M0 5h31M27 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
        </span>
      </a>
    </nav>
  </main>
