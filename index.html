<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gate.css">

  <script src="js/i18n.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/gate.js" defer></script>
</head>
<body class="gate">
  <main class="gate__main" id="main">
    <header class="gate__head" data-testid="station-sign">
      <h1 class="gate__name" translate="no"><span class="sr-only">Kevin Judhistira Girsang</span><span aria-hidden="true">Kevin JG</span></h1>
      <p class="gate__intro" data-i18n="gate.intro">Choose a door.</p>
    </header>

    <div class="gate__lang">
      <div class="lang" role="group" aria-label="Language" data-i18n-attr="aria-label:common.lang" data-testid="lang-switcher">
        <button class="lang__opt" type="button" lang="en" title="English" aria-label="English" aria-pressed="true" data-lang-option="en" data-testid="lang-option-en">EN</button>
        <button class="lang__opt" type="button" lang="id" title="Bahasa Indonesia" aria-label="Bahasa Indonesia" aria-pressed="false" data-lang-option="id" data-testid="lang-option-id">ID</button>
        <button class="lang__opt" type="button" lang="ja" title="日本語" aria-label="日本語" aria-pressed="false" data-lang-option="ja" data-testid="lang-option-ja">日本語</button>
      </div>
    </div>

    <!-- Two fields, white and royal, with one circle split across the seam. Each field is a door. -->
    <nav class="stage" aria-label="Doors" data-i18n-attr="aria-label:gate.doors" data-gate data-testid="gate-doors">

      <a class="door door--qa" href="qa/" data-door data-tone="light" data-testid="door-qa">
        <span class="door__disc" aria-hidden="true"></span>
        <span class="door__tate tate" lang="ja" aria-hidden="true">品質保証</span>
        <span class="door__body">
          <span class="door__label" data-i18n="gate.qa">QA Engineer</span>
          <span class="door__sub" data-i18n="qa.hero.sub">Payments · Online Banking · Jakarta</span>
          <span class="door__cue" aria-hidden="true" data-cue data-i18n="gate.tap" data-testid="door-qa-cue">Tap to open</span>
        </span>
      </a>

      <a class="door door--art" href="art/" data-door data-tone="dark" data-testid="door-art">
        <span class="door__disc" aria-hidden="true"></span>
        <span class="door__tate tate" lang="ja" aria-hidden="true">柳のアトリエ</span>
        <span class="door__body">
          <span class="door__label" translate="no" data-i18n="gate.art">The Willow Atelier</span>
          <span class="door__sub" data-i18n="art.tagline">Where the lost come to rest.</span>
          <span class="door__cue" aria-hidden="true" data-cue data-i18n="gate.tap" data-testid="door-art-cue">Tap to open</span>
        </span>
      </a>

    </nav>

    <footer class="gate__foot" data-testid="site-footer">
      <p><span>© 2026 Kevin JG</span><span class="credit__dot" aria-hidden="true">·</span><span data-i18n="common.made">Made with help from Claude</span></p>
    </footer>
  </main>
</body>
</html>
